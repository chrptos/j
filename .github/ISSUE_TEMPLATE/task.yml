name: タスク
description: 機能・文書の追加や変更
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 何のために対応するか
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 対応内容
      description: 何を追加・変更するか
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: どこまでできたら完了か
      placeholder: "- [ ] 完了を確認できる条件"
    validations:
      required: true
