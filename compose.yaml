services:
  api:
    build: .
    environment:
      HTTP_PORT: ${HTTP_PORT:?set HTTP_PORT in .env.local}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:?set HTTP_READ_HEADER_TIMEOUT in .env.local}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:?set HTTP_READ_TIMEOUT in .env.local}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:?set HTTP_WRITE_TIMEOUT in .env.local}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:?set HTTP_IDLE_TIMEOUT in .env.local}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:?set HTTP_SHUTDOWN_TIMEOUT in .env.local}
      DB_HOST: ${DB_HOST:?set DB_HOST in .env.local}
      DB_PORT: ${DB_PORT:?set DB_PORT in .env.local}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.local}
      DB_SSLMODE: ${DB_SSLMODE:?set DB_SSLMODE in .env.local}
      DB_MAX_CONNS: ${DB_MAX_CONNS:?set DB_MAX_CONNS in .env.local}
      DB_MIN_CONNS: ${DB_MIN_CONNS:?set DB_MIN_CONNS in .env.local}
      DB_ACQUIRE_TIMEOUT: ${DB_ACQUIRE_TIMEOUT:?set DB_ACQUIRE_TIMEOUT in .env.local}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:?set DB_QUERY_TIMEOUT in .env.local}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:?set DB_CONNECT_TIMEOUT in .env.local}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:?set DB_LOCK_TIMEOUT in .env.local}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:?set DB_STATEMENT_TIMEOUT in .env.local}
      DB_STARTUP_TIMEOUT: ${DB_STARTUP_TIMEOUT:?set DB_STARTUP_TIMEOUT in .env.local}
      HEALTH_DB_TIMEOUT: ${HEALTH_DB_TIMEOUT:?set HEALTH_DB_TIMEOUT in .env.local}
    ports:
      - "${API_BIND_HOST:?}:${API_HOST_PORT:?}:${HTTP_PORT:?}"
    cpus: ${API_CPUS:?}
    mem_limit: ${API_MEMORY:?}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: ${API_STOP_GRACE_PERIOD:?}
  migrate:
    build: .
    profiles: ["tools"]
    entrypoint: ["/migrate"]
    environment:
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      DB_SSLMODE: ${DB_SSLMODE:?}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment:
      DB_PORT: ${DB_PORT:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    command: ["postgres", "-p", "${DB_PORT:?}", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - postgres_data:/var/lib/postgresql
    cpus: ${DB_CPUS:?}
    mem_limit: ${DB_MEMORY:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT:?} -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: ${DB_HEALTH_INTERVAL:?}
      timeout: ${DB_HEALTH_TIMEOUT:?}
      retries: ${DB_HEALTH_RETRIES:?}
  monitoring_setup:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    profiles: ["monitoring"]
    environment:
      PGHOST: db
      PGPORT: ${DB_PORT:?}
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      METRICS_PASSWORD: ${METRICS_DB_PASSWORD:?}
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/setup.sql"]
    volumes:
      - ./monitoring/setup.sql:/setup.sql:ro
    depends_on:
      db:
        condition: service_healthy
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_URI: db:${DB_PORT:?}/${POSTGRES_DB:?}?sslmode=${DB_SSLMODE:?}
      DATA_SOURCE_USER: j_metrics
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD:?}
      PG_EXPORTER_COLLECTION_TIMEOUT: 3s
    command: ["--collector.stat_statements", "--collector.stat_statements.exclude_users=j_metrics", "--config.file=/etc/postgres_exporter.yml"]
    volumes:
      - ./monitoring/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    cpus: 0.25
    mem_limit: 256m
    depends_on:
      monitoring_setup:
        condition: service_completed_successfully
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["monitoring"]
    environment:
      API_PORT: ${HTTP_PORT:?}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'sed "s/API_PORT/$$API_PORT/g" /etc/prometheus/template.yml > /tmp/prometheus.yml; exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/template.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:?}:9090"
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      - api
      - postgres_exporter
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:?}:3000"
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
