services:
  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://j:j_local@db:5432/j?sslmode=disable"
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 2
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 10s
  db:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment:
      POSTGRES_USER: j
      POSTGRES_PASSWORD: j_local
      POSTGRES_DB: j
    volumes:
      - postgres_data:/var/lib/postgresql
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U j -d j"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  postgres_data:
